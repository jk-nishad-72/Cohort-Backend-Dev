<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <h1>📝 Notes App</h1>
  <input type="text" id="title" placeholder="Enter title" />
  <input type="text" id="content" placeholder="Enter content" />
  <button onclick="addNote()">Add Note</button>

  <h2>All Notes</h2>
  <div id="notes"></div>

  <script>
    const API_BASE = "http://localhost:3000";

    async function addNote() {
      const tittle = document.getElementById("title").value;
      const content = document.getElementById("content").value;

      const res = await fetch(`${API_BASE}/notes`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ tittle, content }),
      });

      const data = await res.json();
      alert(data.Message);
      getNotes();
    }

    async function getNotes() {
      const res = await fetch(`${API_BASE}/notes`);
      const data = await res.json();

      const notesDiv = document.getElementById("notes");
      notesDiv.innerHTML = "";

      data.Notes.forEach((note) => {
        notesDiv.innerHTML += `
          <div style="border:1px solid gray; margin:10px; padding:10px;">
            <h3>${note.tittle}</h3>
            <p>${note.content}</p>
            <button onclick="deleteNote('${note._id}')">Delete</button>
            <button onclick="editNote('${note._id}')">Edit</button>
          </div>
        `;
      });
    }

    async function deleteNote(id) {
      await fetch(`${API_BASE}/notes/${id}`, {
        method: "DELETE",
      });
      getNotes();
    }

    async function editNote(id) {
      const newTitle = prompt("Enter new title:");
      const newContent = prompt("Enter new content:");

      await fetch(`${API_BASE}/notes/${id}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ tittle: newTitle, content: newContent }),
      });

      getNotes();
    }

    getNotes();
  </script>


  
</body>
</html>
